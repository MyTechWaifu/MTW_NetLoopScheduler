; Open this folder as an independent PlatformIO project.
; Install MTW NetLoopScheduler from the PlatformIO Registry.
[platformio]
default_envs = megaatmega2560

[env]
platform = atmelavr @ 5.1.0
framework = arduino
monitor_speed = 115200
lib_deps =
    techiewaifu/mtw-netloopscheduler

[env:megaatmega2560]
board = megaatmega2560

[env:leonardo]
board = leonardo

[env:atmega328pb]
board = ATmega328PB
board_build.f_cpu = 16000000L
